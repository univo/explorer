<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none">
	<!-- No viewBox: keep the original 32px grid spacing at every viewport size. -->
	<rect width="100%" height="100%" fill="url(#grid)"/>
	<defs>
		<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="translate(16 0)">
			<path d="M0 .5H31.5V32" stroke="rgba(229,231,235,0.6)"/>
		</pattern>
	</defs>
</svg>
